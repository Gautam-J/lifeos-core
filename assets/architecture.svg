<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 2078" width="1280" height="2078" role="img" aria-labelledby="title desc">
  <title id="title">LifeOS system design</title>
  <desc id="desc">A browser, a program and an AI agent reach three hostnames. Cloudflare Access guards each hostname, and the Cloudflare Tunnel carries a request to cloudflared on a Raspberry Pi 4. The lifeos binary has three adapters: the admin pages, the REST API and the MCP server. Each adapter calls the service layer, which is the only code that writes Postgres, the file store and the git repository of the wiki. A timer backs the data up to restic and Backblaze B2, a timer pushes the wiki to GitHub, and ntfy sends a message when a unit fails. Prometheus, Grafana and node_exporter run in Docker on the Pi, and Prometheus keeps all data; Grafana is at the dash hostname, behind the Access login only. Each Claude Code session sends its telemetry with a bearer token to the OTel collector, which sends metrics to Prometheus, events to Loki and traces to Tempo.</desc>
  <defs>
    <marker id="head" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8z" fill="#6c6a64"/></marker>
    <marker id="head-dark" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8z" fill="#a09d96"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #3d3d3a; }
    .t { font-family: Georgia, "Times New Roman", serif; font-size: 34px; letter-spacing: -0.5px; fill: #141413; }
    .sub { font-size: 16px; fill: #6c6a64; }
    .h { font-size: 17px; font-weight: 600; fill: #141413; }
    .hs { font-size: 14px; font-weight: 600; fill: #141413; }
    .hl { font-size: 20px; font-weight: 600; fill: #ffffff; }
    .q { font-size: 13px; fill: #3d3d3a; }
    .l { font-size: 13px; fill: #6c6a64; }
    .strip { font-size: 14.5px; font-weight: 600; fill: #141413; }
    .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 0.93em; }
    .a { fill: none; stroke: #6c6a64; stroke-width: 1.5; }
    .ad { stroke: #a09d96; }
    .dk text { fill: #d1cec6; }
    .dk .h, .dk .hs { fill: #faf9f5; }
    .dk .q { fill: #a09d96; }
    .co .on { font-size: 15px; fill: #141413; }
  </style>
  <rect width="1280" height="2078" rx="20" fill="#faf9f5"/>

  <!-- Title -->
  <text x="40" y="66" class="t">LifeOS system design</text>
  <text x="40" y="96" class="sub">One Go binary on a Raspberry Pi 4. Cloudflare Access is the only lock, and the service layer is the only write path.</text>

  <!-- Who uses LifeOS -->
  <rect x="60" y="124" width="360" height="96" rx="12" fill="#ffffff" stroke="#e6dfd8" stroke-width="1.5"/>
  <text x="76" y="153" class="h">You, in a browser</text>
  <text x="76" y="176">MacBook, iPhone, iPad</text>
  <text x="76" y="196">Reads and writes on the admin pages</text>
  <rect x="460" y="124" width="360" height="96" rx="12" fill="#ffffff" stroke="#e6dfd8" stroke-width="1.5"/>
  <text x="476" y="153" class="h">A program</text>
  <text x="476" y="176">iOS Shortcut, script</text>
  <text x="476" y="196">Sends a capture to the REST API</text>
  <rect x="860" y="124" width="360" height="96" rx="12" fill="#ffffff" stroke="#e6dfd8" stroke-width="1.5"/>
  <text x="876" y="153" class="h">An AI agent</text>
  <text x="876" y="176">Claude app, Claude Code</text>
  <text x="876" y="196">Calls the tools of the MCP server</text>

  <!-- Cloudflare: Access and the tunnel -->
  <rect x="40" y="262" width="1200" height="194" rx="16" fill="#efe9de"/>
  <text x="64" y="292" class="h">Cloudflare</text>
  <text x="262" y="292">The only lock: LifeOS has no login of its own</text>
  <rect x="68" y="312" width="344" height="80" rx="12" fill="#faf9f5" stroke="#e6dfd8" stroke-width="1.5"/>
  <text x="84" y="341" class="h">Access for the admin hostname</text>
  <text x="84" y="364">Login with an email code</text>
  <path d="M240 220L240 312" class="a" marker-end="url(#head)"/>
  <text x="250" y="246" class="l">HTTPS</text>
  <rect x="468" y="312" width="344" height="80" rx="12" fill="#faf9f5" stroke="#e6dfd8" stroke-width="1.5"/>
  <text x="484" y="341" class="h">Access for the API hostname</text>
  <text x="484" y="364">A service token for each device</text>
  <path d="M640 220L640 312" class="a" marker-end="url(#head)"/>
  <text x="650" y="246" class="l">HTTPS with a service token</text>
  <rect x="868" y="312" width="344" height="80" rx="12" fill="#faf9f5" stroke="#e6dfd8" stroke-width="1.5"/>
  <text x="884" y="341" class="h">Access for the MCP hostname</text>
  <text x="884" y="364">OAuth login for an MCP client</text>
  <path d="M1040 220L1040 312" class="a" marker-end="url(#head)"/>
  <text x="1050" y="246" class="l">HTTPS with an OAuth token</text>
  <rect x="68" y="404" width="1144" height="36" rx="8" fill="#e3dacb"/>
  <text x="640" y="427" class="strip" text-anchor="middle">Cloudflare Tunnel: carries a request to the Pi only after Access let it pass</text>

  <!-- The Raspberry Pi -->
  <rect x="40" y="500" width="1200" height="1402" rx="16" fill="#f5f0e8" stroke="#d9d0c3" stroke-width="1.5"/>
  <text x="64" y="530"><tspan class="h">Raspberry Pi 4</tspan><tspan dx="14">Each service listens on <tspan class="m">127.0.0.1</tspan> only</tspan></text>
  <path d="M640 440L640 548" class="a" marker-end="url(#head)"/>
  <text x="650" y="483" class="l">An outbound connection of the Pi: no open port</text>
  <rect x="68" y="548" width="1144" height="48" rx="8" fill="#faf9f5" stroke="#e6dfd8" stroke-width="1.5"/>
  <text x="84" y="577"><tspan class="h"><tspan class="m">cloudflared</tspan></tspan><tspan dx="14">checks the Access token of each request again, then sends the request on by its hostname and its path</tspan></text>
  <path d="M240 596L240 652" class="a" marker-end="url(#head)"/>
  <text x="250" y="628" class="l"><tspan class="m">/admin</tspan>  to  <tspan class="m">127.0.0.1:8200</tspan></text>
  <path d="M640 596L640 652" class="a" marker-end="url(#head)"/>
  <text x="650" y="628" class="l"><tspan class="m">/api</tspan>  to  <tspan class="m">127.0.0.1:8200</tspan></text>
  <path d="M1040 596L1040 652" class="a" marker-end="url(#head)"/>
  <text x="1050" y="628" class="l"><tspan class="m">/mcp</tspan>  to  <tspan class="m">127.0.0.1:8100</tspan></text>

  <!-- The lifeos binary -->
  <rect x="68" y="652" width="1144" height="648" rx="16" fill="#181715"/>
  <g class="dk">
    <text x="100" y="684"><tspan class="h"><tspan class="m">lifeos serve</tspan></tspan><tspan dx="14">One Go binary. The systemd unit <tspan class="m">lifeos.service</tspan> runs it.</tspan></text>
    <rect x="84" y="700" width="1112" height="40" rx="8" fill="#252320" stroke="#3a3733" stroke-width="1.5"/>
    <text x="100" y="725"><tspan class="m">http.CrossOriginProtection</tspan>  refuses a write that a browser sends from a different origin</text>
    <path d="M240 740L240 768" class="a ad" marker-end="url(#head-dark)"/>
    <rect x="84" y="768" width="312" height="136" rx="12" fill="#252320" stroke="#3a3733" stroke-width="1.5"/>
    <text x="100" y="797" class="h">Admin pages</text>
    <text x="100" y="820"><tspan class="m">internal/admin</tspan></text>
    <text x="100" y="840">templ + htmx, rendered on the server</text>
    <text x="100" y="860">Writes manual rows</text>
    <text x="100" y="880">The only place for a permanent delete</text>
    <path d="M240 904L240 1008" class="a ad" marker-end="url(#head-dark)"/>
    <path d="M640 740L640 768" class="a ad" marker-end="url(#head-dark)"/>
    <rect x="484" y="768" width="312" height="136" rx="12" fill="#252320" stroke="#3a3733" stroke-width="1.5"/>
    <text x="500" y="797" class="h">REST API</text>
    <text x="500" y="820"><tspan class="m">internal/api</tspan></text>
    <text x="500" y="840">chi + Huma, validation from Go types</text>
    <text x="500" y="860">Writes manual rows</text>
    <text x="500" y="880">OpenAPI spec at <tspan class="m">/api/openapi.json</tspan></text>
    <path d="M640 904L640 1008" class="a ad" marker-end="url(#head-dark)"/>
    <path d="M1040 740L1040 768" class="a ad" marker-end="url(#head-dark)"/>
    <rect x="884" y="768" width="312" height="136" rx="12" fill="#252320" stroke="#3a3733" stroke-width="1.5"/>
    <text x="900" y="797" class="h">MCP server</text>
    <text x="900" y="820"><tspan class="m">internal/mcp</tspan></text>
    <text x="900" y="840">Official MCP Go SDK, 19 tools</text>
    <text x="900" y="860">Writes agent rows</text>
    <text x="900" y="880"><tspan class="m">AccessCheck</tspan>: 403 with no valid token</text>
    <path d="M1040 904L1040 1008" class="a ad" marker-end="url(#head-dark)"/>
    <rect x="270" y="924" width="340" height="58" rx="8" fill="none" stroke="#6c6a64" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="286" y="947" class="hs">Connectors, not built yet</text>
    <text x="286" y="967" class="q">calendar, mail, health, location, CSV</text>
    <path d="M440 982L440 1008" class="a ad" stroke-dasharray="4 4" marker-end="url(#head-dark)"/>
    <rect x="670" y="924" width="340" height="58" rx="8" fill="none" stroke="#6c6a64" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="686" y="947" class="hs">Jobs, not built yet</text>
    <text x="686" y="967" class="q">briefs, inbox, lint of the wiki</text>
    <path d="M840 982L840 1008" class="a ad" stroke-dasharray="4 4" marker-end="url(#head-dark)"/>
  </g>

  <!-- The service layer: the only write path -->
  <rect x="84" y="1008" width="1112" height="216" rx="12" fill="#cc785c"/>
  <g class="co">
    <text x="100" y="1041"><tspan class="hl">Service layer</tspan><tspan dx="14" class="on"><tspan class="m">internal/service</tspan></tspan></text>
    <text x="1180" y="1041" class="on" text-anchor="end">All logic is here. Each write goes through it.</text>
    <rect x="100" y="1058" width="352" height="44" rx="8" fill="#faf9f5"/>
    <text x="112" y="1076" class="hs">Validation</text>
    <text x="112" y="1093" class="q">checks each field before a write</text>
    <rect x="464" y="1058" width="352" height="44" rx="8" fill="#faf9f5"/>
    <text x="476" y="1076" class="hs">Secret check</text>
    <text x="476" y="1093" class="q">refuses a card number, an ID number, a key</text>
    <rect x="828" y="1058" width="352" height="44" rx="8" fill="#faf9f5"/>
    <text x="840" y="1076" class="hs">Provenance</text>
    <text x="840" y="1093" class="q"><tspan class="m">source</tspan> and the two times on each row</text>
    <rect x="100" y="1110" width="352" height="44" rx="8" fill="#faf9f5"/>
    <text x="112" y="1128" class="hs">Event log</text>
    <text x="112" y="1145" class="q">one row in <tspan class="m">events</tspan> for each write</text>
    <rect x="464" y="1110" width="352" height="44" rx="8" fill="#faf9f5"/>
    <text x="476" y="1128" class="hs">Soft delete</text>
    <text x="476" y="1145" class="q">sets <tspan class="m">deleted_at</tspan>; a purge needs the admin pages</text>
    <rect x="828" y="1110" width="352" height="44" rx="8" fill="#faf9f5"/>
    <text x="840" y="1128" class="hs">Journal link</text>
    <text x="840" y="1145" class="q">a log, a todo or an item names its <tspan class="m">journal_ref</tspan></text>
    <rect x="100" y="1162" width="352" height="44" rx="8" fill="#faf9f5"/>
    <text x="112" y="1180" class="hs">Search</text>
    <text x="112" y="1197" class="q">words in items, journal, todos and sources</text>
    <rect x="464" y="1162" width="352" height="44" rx="8" fill="#faf9f5"/>
    <text x="476" y="1180" class="hs">Wiki writer</text>
    <text x="476" y="1197" class="q">one commit for each write of a page</text>
    <rect x="828" y="1162" width="352" height="44" rx="8" fill="#faf9f5"/>
    <text x="840" y="1180" class="hs">Read-only query</text>
    <text x="840" y="1197" class="q">the SQL of an agent, as <tspan class="m">lifeos_query</tspan></text>
  </g>
  <g class="dk">
    <path d="M240 1224L240 1244" class="a ad" marker-end="url(#head-dark)"/>
    <rect x="84" y="1244" width="312" height="40" rx="8" fill="#252320" stroke="#3a3733" stroke-width="1.5"/>
    <text x="100" y="1269"><tspan class="m">internal/store</tspan>: sqlc + pgx</text>
  </g>

  <!-- Storage -->
  <path d="M240 1284L240 1360" class="a" marker-end="url(#head)"/>
  <path d="M640 1224L640 1360" class="a" marker-end="url(#head)"/>
  <path d="M1040 1224L1040 1360" class="a" marker-end="url(#head)"/>
  <text x="250" y="1335" class="l">SQL, with two roles</text>
  <text x="650" y="1335" class="l">the bytes of a file</text>
  <text x="1050" y="1335" class="l">Markdown, git commit</text>
  <rect x="68" y="1360" width="344" height="178" rx="12" fill="#faf9f5" stroke="#e6dfd8" stroke-width="1.5"/>
  <text x="84" y="1389" class="h">Postgres 18</text>
  <text x="84" y="1412">Docker container, <tspan class="m">127.0.0.1:5432</tspan></text>
  <text x="84" y="1432"><tspan class="m">catalog_items, journal_entries, todos,</tspan></text>
  <text x="84" y="1452"><tspan class="m">habits, habit_logs, sources, events</tspan></text>
  <text x="84" y="1472">Role <tspan class="m">lifeos</tspan>: reads and writes</text>
  <text x="84" y="1492">Role <tspan class="m">lifeos_query</tspan>: SELECT only</text>
  <text x="84" y="1512">Tests use a second server, in memory</text>
  <rect x="468" y="1360" width="344" height="178" rx="12" fill="#faf9f5" stroke="#e6dfd8" stroke-width="1.5"/>
  <text x="484" y="1389" class="h">File store and inbox</text>
  <text x="484" y="1412"><tspan class="m">/var/lib/lifeos/files</tspan></text>
  <text x="484" y="1432">A file has its SHA-256 as its name</text>
  <text x="484" y="1452"><tspan class="m">/var/lib/lifeos/inbox</tspan></text>
  <text x="484" y="1472">A file that waits for a capture</text>
  <text x="484" y="1492"></text>
  <text x="484" y="1512">A source row names the file</text>
  <rect x="868" y="1360" width="344" height="178" rx="12" fill="#faf9f5" stroke="#e6dfd8" stroke-width="1.5"/>
  <text x="884" y="1389" class="h">Wiki</text>
  <text x="884" y="1412"><tspan class="m">/var/lib/lifeos/lifeos-wiki</tspan></text>
  <text x="884" y="1432">A git repository of Markdown pages</text>
  <text x="884" y="1452">One commit for each write</text>
  <text x="884" y="1472">A page cites a row, as <tspan class="m">(journal:57)</tspan></text>
  <text x="884" y="1492"></text>
  <text x="884" y="1512">The analysis is here; a fact is a row</text>

  <!-- Operations: scripts and systemd timers -->
  <path d="M203.5 1598L203.5 1538" class="a" marker-end="url(#head)"/>
  <text x="213.5" y="1572" class="l">dump, migrate</text>
  <path d="M385 1538L385 1598" class="a" marker-end="url(#head)"/>
  <text x="395" y="1572" class="l">pg_dump</text>
  <path d="M550 1538L550 1598" class="a" marker-end="url(#head)"/>
  <text x="560" y="1572" class="l">copy of the files</text>
  <path d="M1076.5 1538L1076.5 1598" class="a" marker-end="url(#head)"/>
  <text x="1086.5" y="1572" class="l">git fetch</text>
  <rect x="68" y="1598" width="271" height="140" rx="12" fill="#faf9f5" stroke="#e6dfd8" stroke-width="1.5"/>
  <text x="84" y="1627" class="h">Deploy</text>
  <text x="84" y="1650"><tspan class="m">deploy/deploy.sh</tspan>, run by hand</text>
  <text x="84" y="1670">pull, build, dump, migrate,</text>
  <text x="84" y="1690">restart, then <tspan class="m">check-access.sh</tspan></text>
  <text x="84" y="1710">fails if a hostname is open</text>
  <rect x="359" y="1598" width="271" height="140" rx="12" fill="#faf9f5" stroke="#e6dfd8" stroke-width="1.5"/>
  <text x="375" y="1627" class="h">Backup</text>
  <text x="375" y="1650"><tspan class="m">lifeos-backup.timer</tspan></text>
  <text x="375" y="1670">Each night at 02:00</text>
  <text x="375" y="1690">Database, files, monitoring data</text>
  <text x="375" y="1710">go into two restic repositories</text>
  <rect x="650" y="1598" width="271" height="140" rx="12" fill="#faf9f5" stroke="#e6dfd8" stroke-width="1.5"/>
  <text x="666" y="1627" class="h">Notifications</text>
  <text x="666" y="1650">ntfy, Docker, <tspan class="m">127.0.0.1:2586</tspan></text>
  <text x="666" y="1670">A unit that fails sends a message:</text>
  <text x="666" y="1690">the server, the backup,</text>
  <text x="666" y="1710">the push of the wiki</text>
  <rect x="941" y="1598" width="271" height="140" rx="12" fill="#faf9f5" stroke="#e6dfd8" stroke-width="1.5"/>
  <text x="957" y="1627" class="h">Wiki push</text>
  <text x="957" y="1650"><tspan class="m">lifeos-wiki-push.timer</tspan></text>
  <text x="957" y="1670">Each hour, into a bare mirror,</text>
  <text x="957" y="1690">then from the mirror to GitHub</text>
  <text x="957" y="1710">The server holds no key</text>

  <!-- Outside the Pi -->
  <rect x="68" y="1758" width="271" height="188" rx="12" fill="#faf9f5" stroke="#e6dfd8" stroke-width="1.5"/>
  <text x="84" y="1787" class="h">Monitoring</text>
  <text x="84" y="1810">Prometheus, Grafana, node_exporter</text>
  <text x="84" y="1830"><tspan class="m">127.0.0.1:9090</tspan>, <tspan class="m">127.0.0.1:3000</tspan></text>
  <text x="84" y="1850">Keep all data. Grafana is at the</text>
  <text x="84" y="1870">dash hostname: Access only</text>
  <text x="84" y="1894">Claude Code telemetry: the OTel</text>
  <text x="84" y="1914">collector <tspan class="m">127.0.0.1:4318</tspan>, Loki,</text>
  <text x="84" y="1934">Tempo; otel hostname: a token</text>
  <path d="M494.5 1738L494.5 1962" class="a" marker-end="url(#head)"/>
  <text x="504.5" y="1937" class="l">restic</text>
  <rect x="359" y="1962" width="271" height="76" rx="12" fill="#ffffff" stroke="#e6dfd8" stroke-width="1.5"/>
  <text x="375" y="1991" class="h">Backblaze B2</text>
  <text x="375" y="2014">The second restic repository</text>
  <path d="M785.5 1738L785.5 1962" class="a" marker-end="url(#head)"/>
  <text x="795.5" y="1937" class="l">message</text>
  <rect x="650" y="1962" width="271" height="76" rx="12" fill="#ffffff" stroke="#e6dfd8" stroke-width="1.5"/>
  <text x="666" y="1991" class="h">Your phone</text>
  <text x="666" y="2014">Gets the ntfy message</text>
  <path d="M1076.5 1738L1076.5 1962" class="a" marker-end="url(#head)"/>
  <text x="1086.5" y="1937" class="l">git push</text>
  <rect x="941" y="1962" width="271" height="76" rx="12" fill="#ffffff" stroke="#e6dfd8" stroke-width="1.5"/>
  <text x="957" y="1991" class="h">GitHub</text>
  <text x="957" y="2014">Private repository <tspan class="m">lifeos-wiki</tspan></text>

  <!-- Legend -->
  <path d="M68 1976L104 1976" class="a" marker-end="url(#head)"/>
  <text x="118" y="1980" class="q">A request, or data</text>
  <rect x="68" y="1994" width="36" height="16" rx="4" fill="none" stroke="#6c6a64" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="118" y="2006" class="q">Planned, not built yet</text>
  <rect x="68" y="2020" width="36" height="16" rx="4" fill="#cc785c"/>
  <text x="118" y="2032" class="q">The only write path</text>
</svg>
