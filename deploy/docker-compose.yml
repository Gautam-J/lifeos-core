# Third-party services for LifeOS. Every service listens on 127.0.0.1 only.
# Secrets come from deploy/.env, which is not in git.
name: lifeos

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifeos
      POSTGRES_DB: lifeos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos -d lifeos"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The Postgres server of the tests. Its data is in memory: one run of the
  # tests writes about 2.5 GB, and the SD card must not get that load. The
  # server holds nothing of value, so it does not wait for a write to be
  # safe. A start of the container gives an empty server; the init script
  # makes the user lifeos_query again. The data cannot use more memory than
  # the size of the tmpfs.
  postgres-test:
    image: postgres:18
    restart: unless-stopped
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off", "-c", "max_wal_size=96MB"]
    environment:
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      LIFEOS_QUERY_PASSWORD: ${LIFEOS_QUERY_PASSWORD:?set LIFEOS_QUERY_PASSWORD in deploy/.env}
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql:size=768m
    volumes:
      - ./postgres-test-init.sh:/docker-entrypoint-initdb.d/10-query-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  ntfy:
    image: binwiederhier/ntfy:v2
    restart: unless-stopped
    command: serve
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL:?set NTFY_BASE_URL in deploy/.env}
      # Wakes the iOS app through ntfy.sh; the message itself stays on the Pi.
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ENABLE_LOGIN: "true"
    ports:
      - "127.0.0.1:2586:80"
    volumes:
      - ntfydata:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -q '\"healthy\":true'"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Metrics of the Pi and of LifeOS. Grafana reads it on the Compose network.
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    user: "1000:1000"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Delete no data. Without this flag Prometheus keeps 15 days. No
      # retention.size: a size limit deletes the oldest data.
      - --storage.tsdb.retention.time=100y
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /var/lib/lifeos-monitoring/prometheus:/prometheus
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  # The health of the Pi: CPU, memory, file systems, temperature, systemd
  # units, and the throttle flags that lifeos-throttled.timer writes. It
  # reads the host through read-only mounts. It is on the Compose network
  # with no published port: Prometheus scrapes it there. The network
  # counters are of the container, not of the Pi.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    user: "1000:1000"
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.systemd
      - --collector.systemd.unit-include=.+\.(service|timer)
      - --collector.textfile.directory=/textfile
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      - /run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
      - /run/udev:/run/udev:ro
      - /var/lib/lifeos-monitoring/node-exporter:/textfile:ro
    mem_limit: 64m

  # The dashboards. The public hostname dash.<domain> has an Access login.
  # Grafana has no login of its own, so Access is the one login.
  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    user: "1000:1000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in deploy/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://${LIFEOS_DASH_HOST:?set LIFEOS_DASH_HOST in deploy/.env}/
      # One login: Cloudflare Access. Grafana has no login of its own: each
      # request is the anonymous user, with the role Admin. Grafana listens
      # on 127.0.0.1 only, as the admin pages of lifeos do.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      # Grafana checks the origin of a write only when it has a login cookie.
      # With no login, a page of a different site could then write with the
      # Access cookie of the browser. This turns the check on for each write.
      GF_SECURITY_CSRF_ALWAYS_CHECK: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../dashboards:/var/lib/grafana-dashboards:ro
      - /var/lib/lifeos-monitoring/grafana:/var/lib/grafana
    depends_on:
      - prometheus
    mem_limit: 384m

volumes:
  pgdata:
  ntfydata:
