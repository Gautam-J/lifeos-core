# The data sources of Grafana: metrics, the events and the traces of Claude
# Code.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # The shortest scrape interval (the job node). Grafana takes 15s by
      # default and then shows a new value only each 15 seconds.
      timeInterval: 5s
  # The events of Claude Code.
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
  # The traces of Claude Code.
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
