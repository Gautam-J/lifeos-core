# The one LifeOS configuration file.

# Listen addresses. Each must be on 127.0.0.1: the Cloudflare Tunnel is the
# only way in. The design doc gives the API port 8000, but another service on
# this Pi uses 8000.
http_addr: 127.0.0.1:8200
mcp_addr: 127.0.0.1:8100

# Postgres URL without a password. The password comes from POSTGRES_PASSWORD
# in the environment (deploy/.env).
database_url: postgres://lifeos@127.0.0.1:5432/lifeos?sslmode=disable

# The same database as the read-only user lifeos_query, for the query tool.
# The password comes from LIFEOS_QUERY_PASSWORD in the environment
# (deploy/.env). `make query-user` makes the user.
query_database_url: postgres://lifeos_query@127.0.0.1:5432/lifeos?sslmode=disable

# The file store and the inbox of captured files. The two folders must
# exist. The nightly backup copies files_dir.
files_dir: /var/lib/lifeos/files
inbox_dir: /var/lib/lifeos/inbox
# The largest file that a capture accepts, in megabytes.
max_file_mb: 50

# The folder of the wiki pages. It must exist, and it must be in a git
# repository: each write of a page is a commit there. The repository is
# below /var/lib/lifeos, the one folder that the service unit can write.
wiki_dir: /var/lib/lifeos/lifeos-wiki/wiki
